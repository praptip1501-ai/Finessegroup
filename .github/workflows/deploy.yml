name: Deploy Theme to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy Theme via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📂 Sync theme files to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          server-dir: ${{ secrets.FTP_REMOTE_DIR || 'htdocs/wp-content/themes/Finessegroup/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            .gitignore
            readme.txt

